# Builds the Astro site and deploys it to GitHub Pages.
#
# One-time setup: repository Settings → Pages → Build and deployment →
# Source: "GitHub Actions". (With "Deploy from a branch", GitHub runs Jekyll
# on the raw source code and the deployment fails.)
#
# The site URL and base path come from GitHub automatically:
#   https://<user>.github.io/<repo>/ → BASE_PATH=/<repo>
#   a custom domain configured in Settings → Pages → base path "/"
#
# Note: GitHub Pages serves static files only. The dashboard's sign-in
# (functions/oauth) does not run here — deploy cms-auth/ as a standalone
# Worker and set the CMS_AUTH_BASE_URL repository variable. See
# docs/DEPLOYMENT.md → "Deploying to GitHub Pages".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - run: npm ci

      - name: Build
        run: npm run build
        env:
          SITE_URL: ${{ vars.SITE_URL || steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
          CMS_AUTH_BASE_URL: ${{ vars.CMS_AUTH_BASE_URL }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
